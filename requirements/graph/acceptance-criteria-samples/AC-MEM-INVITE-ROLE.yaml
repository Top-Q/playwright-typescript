id: AC-MEM-INVITE-ROLE
type: acceptance_criteria_sample
module: members-roles
title: Invite Member and Assign Role
source:
  document: openproject-demo-requirements.docx
  section: '7.5'
exemplifies:
- FR-MEM-001
- FR-MEM-002
- FR-MEM-004
- FR-MEM-005
- FR-MEM-006
criteria:
- Given I am a Project Manager on the Members page, when I click 'Add member', search for an existing
  user, select a Role, and click Add, then the user appears in the Members list with the selected Role
  and Status 'Active'.
- Given a Member with Role 'Viewer', when I edit their Role to 'Team Member', then their permissions update
  immediately and they can now create Work Packages on next login/reload.
- Given a Member I want to remove, when I click Remove and confirm, then they no longer appear in the
  Members list and lose access to the Project.
- Given I attempt to remove the only Member with a manage-capable Role, when I confirm removal, then the
  system blocks the action with an explanatory error.
notes: Use as style/format reference for generated test cases; these are already human-approved, do not
  regenerate them from scratch.
